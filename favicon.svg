<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#circleGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Inner shadow circle -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  
  <!-- NT Text -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)" letter-spacing="0.5px">NT</text>
</svg>
