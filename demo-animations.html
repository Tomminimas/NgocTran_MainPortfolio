<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngoc Tran • Portfolio - Animation Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            cursor: none !important;
        }

        /* Custom animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes moveAcross {
            0% { transform: translateX(-100px) translateY(100vh) rotate(45deg); }
            100% { transform: translateX(100vw) translateY(-100px) rotate(405deg); }
        }

        @keyframes moveReverse {
            0% { transform: translateX(100vw) translateY(-100px) scale(1); }
            100% { transform: translateX(-100px) translateY(100vh) scale(1.5); }
        }

        @keyframes floatIcon {
            0% { transform: translateX(100vw) translateY(20vh) rotate(0deg); }
            100% { transform: translateX(-50px) translateY(80vh) rotate(360deg); }
        }

        @keyframes binaryFall {
            0% { transform: translateY(-50px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 1000; opacity: 0; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes pulseScale {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }

        .scale-in {
            animation: scaleIn 0.8s ease-out forwards;
        }

        .bounce-animation {
            animation: bounce 2s ease-in-out infinite;
        }

        .rotating-shape {
            animation: moveAcross 25s linear infinite;
        }

        .floating-circle {
            animation: moveReverse 20s linear infinite;
        }

        .floating-icon {
            animation: floatIcon 35s linear infinite;
        }

        .binary-rain {
            animation: binaryFall 3s linear infinite;
        }

        .animated-path {
            stroke-dasharray: 1000;
            animation: drawPath 8s ease-in-out infinite;
        }

        .pulse-dot {
            animation: pulseScale 3s ease-in-out infinite;
        }

        /* Cursor styles */
        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .cursor-ring {
            position: fixed;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            mix-blend-mode: difference;
            transition: transform 0.2s ease, scale 0.2s ease;
        }

        /* Hover effects */
        .btn:hover {
            transform: translateY(-2px) scale(1.05);
            transition: all 0.3s ease;
        }

        .btn {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-900 via-blue-900 to-gray-900 text-white min-h-screen overflow-x-hidden">
    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- Animated Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <!-- Gradient Orbs -->
        <div class="absolute w-96 h-96 rounded-full opacity-20 bg-gradient-radial from-blue-500/50 to-transparent" 
             style="top: 10%; left: 10%; animation: moveAcross 20s linear infinite;"></div>
        <div class="absolute w-80 h-80 rounded-full opacity-15 bg-gradient-radial from-purple-500/40 to-transparent" 
             style="top: 60%; right: 10%; animation: moveReverse 25s linear infinite;"></div>
        <div class="absolute w-64 h-64 rounded-full opacity-10 bg-gradient-radial from-green-500/30 to-transparent" 
             style="bottom: 20%; left: 50%; animation: float 30s ease-in-out infinite;"></div>

        <!-- Floating Particles -->
        <div class="absolute inset-0">
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 10%; top: 80%; animation: binaryFall 15s linear infinite;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 20%; top: 90%; animation: binaryFall 18s linear infinite 2s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 30%; top: 85%; animation: binaryFall 12s linear infinite 4s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 40%; top: 95%; animation: binaryFall 20s linear infinite 1s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 50%; top: 88%; animation: binaryFall 16s linear infinite 3s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 60%; top: 92%; animation: binaryFall 14s linear infinite 5s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 70%; top: 87%; animation: binaryFall 22s linear infinite 2s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 80%; top: 93%; animation: binaryFall 19s linear infinite 4s;"></div>
            <div class="absolute w-1 h-1 bg-white/20 rounded-full" style="left: 90%; top: 89%; animation: binaryFall 17s linear infinite 1s;"></div>
        </div>

        <!-- Animated Lines -->
        <svg class="absolute inset-0 w-full h-full opacity-20">
            <path d="M0,100 Q150,50 300,100 T600,100" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none" class="animated-path"/>
            <path d="M100,200 Q250,150 400,200 T700,200" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1" fill="none" class="animated-path" style="animation-delay: 2s;"/>
            <path d="M50,300 Q200,250 350,300 T650,300" stroke="rgba(147, 51, 234, 0.15)" stroke-width="1" fill="none" class="animated-path" style="animation-delay: 4s;"/>
        </svg>

        <!-- Pulsing Dots -->
        <div class="absolute w-2 h-2 bg-white/30 rounded-full pulse-dot" style="left: 20%; top: 30%;"></div>
        <div class="absolute w-2 h-2 bg-white/30 rounded-full pulse-dot" style="left: 70%; top: 40%; animation-delay: 1s;"></div>
        <div class="absolute w-2 h-2 bg-white/30 rounded-full pulse-dot" style="left: 40%; top: 60%; animation-delay: 2s;"></div>
        <div class="absolute w-2 h-2 bg-white/30 rounded-full pulse-dot" style="left: 80%; top: 70%; animation-delay: 3s;"></div>
        <div class="absolute w-2 h-2 bg-white/30 rounded-full pulse-dot" style="left: 15%; top: 50%; animation-delay: 4s;"></div>
    </div>

    <!-- Floating Elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <!-- Geometric Shapes -->
        <div class="absolute w-20 h-20 border border-blue-400/20 rotating-shape" style="transform: rotate(45deg);"></div>
        <div class="absolute w-16 h-16 bg-purple-500/10 rounded-full floating-circle"></div>
        <div class="absolute w-12 h-12 bg-gradient-to-r from-green-400/20 to-blue-500/20 rounded-lg" style="transform: rotate(12deg); animation: moveAcross 30s linear infinite;"></div>

        <!-- Data Icons -->
        <div class="absolute text-2xl opacity-20 floating-icon">📊</div>
        <div class="absolute text-xl opacity-15 floating-icon" style="animation-delay: 5s; animation-duration: 28s;">📈</div>
        <div class="absolute text-lg opacity-25 floating-icon" style="animation-delay: 10s; animation-duration: 22s;">💼</div>

        <!-- Binary Code Rain -->
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 5%;">1</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 15%; animation-delay: 1s;">0</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 25%; animation-delay: 2s;">1</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 35%; animation-delay: 3s;">0</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 45%; animation-delay: 4s;">1</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 55%; animation-delay: 0.5s;">0</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 65%; animation-delay: 1.5s;">1</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 75%; animation-delay: 2.5s;">0</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 85%; animation-delay: 3.5s;">1</div>
        <div class="absolute text-green-400/10 text-xs font-mono select-none binary-rain" style="left: 95%; animation-delay: 4.5s;">0</div>
    </div>

    <!-- Main Content -->
    <main class="min-h-screen relative overflow-hidden">
        <div class="relative z-10 container mx-auto max-w-6xl px-6 min-h-screen flex items-center justify-center">
            <div class="text-center">
                <h1 class="text-6xl md:text-8xl font-bold mb-6 bg-gradient-to-r from-white via-blue-100 to-purple-200 bg-clip-text text-transparent scale-in" style="animation-delay: 0.7s; opacity: 0;">
                    Ngoc Tran
                </h1>
                
                <p class="text-xl md:text-2xl text-gray-300 mb-8 max-w-2xl mx-auto fade-in-up" style="animation-delay: 1s; opacity: 0;">
                    Business Analytics & Finance • Data‑Driven Storyteller
                </p>
                
                <div class="flex gap-4 justify-center flex-wrap fade-in-up" style="animation-delay: 1.3s; opacity: 0;">
                    <button class="btn inline-flex items-center justify-center rounded-full border border-white/30 px-8 py-3 text-lg font-medium bg-white text-black hover:bg-gray-100 transition-all duration-300">
                        View My Work
                    </button>
                    
                    <button class="btn inline-flex items-center justify-center rounded-full border border-white/30 px-8 py-3 text-lg font-medium hover:bg-white/10 transition-all duration-300">
                        Contact Me
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10 fade-in-up" style="animation-delay: 2s; opacity: 0;">
            <div class="w-6 h-10 border-2 border-white/30 rounded-full flex justify-center bounce-animation">
                <div class="w-1 h-3 bg-white/60 rounded-full mt-2"></div>
            </div>
        </div>
    </main>

    <script>
        // Custom cursor functionality
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorRing = document.querySelector('.cursor-ring');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursorDot.style.transform = `translate(${mouseX - 4}px, ${mouseY - 4}px)`;
            cursorRing.style.transform = `translate(${mouseX - 16}px, ${mouseY - 16}px)`;
        });

        // Hover effects
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            button.addEventListener('mouseenter', () => {
                cursorRing.style.transform += ' scale(2)';
                cursorDot.style.transform += ' scale(0.5)';
            });
            
            button.addEventListener('mouseleave', () => {
                cursorRing.style.transform = `translate(${mouseX - 16}px, ${mouseY - 16}px)`;
                cursorDot.style.transform = `translate(${mouseX - 4}px, ${mouseY - 4}px)`;
            });
        });

        // Add some interactive particles on click
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'fixed w-1 h-1 bg-blue-400/40 rounded-full pointer-events-none';
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                particle.style.zIndex = '9999';
                document.body.appendChild(particle);

                // Animate particle
                particle.animate([
                    { transform: 'scale(0) translate(0, 0)', opacity: 0 },
                    { transform: 'scale(1) translate(' + (Math.random() - 0.5) * 100 + 'px, ' + (Math.random() - 0.5) * 100 + 'px)', opacity: 1 },
                    { transform: 'scale(0) translate(' + (Math.random() - 0.5) * 200 + 'px, ' + (Math.random() - 0.5) * 200 + 'px)', opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => particle.remove();
            }
        });
    </script>
</body>
</html>
